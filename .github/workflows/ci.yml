name: CI

on:
  push:
  pull_request:
  # 允许手动重跑：CI 关闭后重新开启、或需要在不改代码时复验时用
  # gh workflow run CI --ref <branch>
  workflow_dispatch:

jobs:
  # lint 与平台无关，单独跑一次即可（不必进 4 个矩阵格，省一半以上时间）
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 门禁只拦 error（含 noFloatingPromises / noExplicitAny）。
      # warning/info 是提示，不阻断——见 biome.jsonc 顶部说明。
      - name: Lint
        run: npm run lint

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["20.11.1", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm test
      - name: Build package
        run: npm run build
      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Production package smoke test
        run: npm run package:smoke
        env:
          MEICODE_SKIP_BUILD: "true"
