name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package smoke test
        run: npm run package:smoke
        env:
          MEICODE_SKIP_BUILD: "true"
      - name: Build release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          npm pack --pack-destination release --ignore-scripts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" "release/meicode-$version.tgz" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "MeiCode v$version" `
            --generate-notes
