# MeiCode 配置示例 —— 复制为 ~/.mewcode/config.yaml 并填入真实值
# 注意：Node 24 原生跑 TS，不需要构建，直接 node src/cli.ts 启动
#
# 模型目录模式（推荐）：config 写 provider: <id> 一行切换，协议/端点/默认模型
# 从目录自动取（内置 5 家：deepseek/kimi/qwen/bigmodel/mimo；
# 可编辑 ~/.mewcode/model-providers.json 覆盖或扩展）：
#   provider: deepseek
#   api_key: sk-xxx          # 密钥必填（目录不含密钥）
#   protocol: anthropic      # 可选，默认用目录的 defaultKind
#   model: deepseek-v4-flash # 可选，默认目录第一个模型
#
# 或手写模式（provider 缺省时）：protocol/model/base_url/api_key 全填

name: my-claude
protocol: anthropic
model: claude-sonnet-5
base_url: https://api.anthropic.com
api_key: sk-ant-xxxx
thinking: false
