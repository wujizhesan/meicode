# MeiCode 配置示例 —— 复制为 ~/.meicode/config.yaml 并填入真实值
# 开发环境使用 npm start；发行包安装后使用 meicode 命令
#
# 模型目录模式（推荐）：config 写 provider: <id> 一行切换，协议/端点/默认模型
# 从目录自动取（内置 5 家：deepseek/kimi/qwen/bigmodel/mimo；
# 可编辑 ~/.meicode/model-providers.json 覆盖或扩展）：
#   provider: deepseek
#   api_key_env: DEEPSEEK_API_KEY  # 推荐：从环境变量读取密钥
#   protocol: anthropic      # 可选，默认用目录的 defaultKind
#   model: deepseek-v4-flash # 可选，默认目录第一个模型
#
# 或手写模式（provider 缺省时）：protocol/model/base_url/api_key 全填

name: my-claude
protocol: anthropic
model: claude-sonnet-5
base_url: https://api.anthropic.com
api_key: sk-ant-xxxx
# api_key_env: ANTHROPIC_API_KEY
thinking: false
